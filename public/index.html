<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Supabase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(3, 1fr) auto;
            gap: 10px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .cancel {
            background: #777;
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        .edit {
            background: #555;
            margin-right: 5px;
        }

        .delete {
            background: #b00020;
        }

        @media (max-width: 700px) {
            form {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CRUD Users - Supabase</h1>

        <div class="card">

            <h2 id="formTitle">Tambah User</h2>

            <form id="userForm">

                <input
                    type="text"
                    id="nama"
                    placeholder="Nama"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="number"
                    id="umur"
                    placeholder="Umur"
                    required
                >

                <button type="submit" id="submitButton">
                    Tambah
                </button>

                <button
                    type="button"
                    class="cancel"
                    id="cancelButton"
                >
                    Batal
                </button>

            </form>

        </div>

        <div class="card">

            <h2>Data Users</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>Umur</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="userTable">
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
